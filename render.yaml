services:
  - type: web
    name: ai-research-assistant-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://ai-research-assistant-app-chi.vercel.app"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///aira_dev.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: "8001"
      - key: CHROMA_COLLECTION
        value: research_documents
